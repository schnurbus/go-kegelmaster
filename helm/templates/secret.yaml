{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kegelmaster.secretName" . }}
  labels:
    {{- include "kegelmaster.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.JWT_SECRET is required (or set secrets.existingSecret)" .Values.secrets.JWT_SECRET | quote }}
  DATABASE_URL: {{ required "secrets.DATABASE_URL is required (or set secrets.existingSecret)" .Values.secrets.DATABASE_URL | quote }}
  {{- with .Values.secrets.REDIS_URL }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.RESEND_API_KEY }}
  RESEND_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
