# Default values for kegelmaster.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/schnurbus/go-kegelmaster
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # The app does not call the Kubernetes API.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# Expose the service via Gateway API HTTPRoute (Helm 4 scaffold).
# Requires Gateway API CRDs and a controller in the cluster.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}
  # limits:
  #   cpu: 250m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

# Non-sensitive application configuration. Rendered as a single ConfigMap
# and injected via envFrom. Keys match process environment variables.
#
# Keep replicaCount at 1 while AUTO_MIGRATE is true to avoid concurrent
# migration races. Set PUBLIC_BASE_URL (and CORS_ALLOW_ORIGINS) to the
# public origin when exposing the app via Ingress or HTTPRoute.
config:
  APP_ENV: production
  BACKEND_PORT: "8080"
  PUBLIC_BASE_URL: ""
  CORS_ALLOW_ORIGINS: "*"
  JWT_TTL_MINUTES: "1440"
  REMEMBER_ME_DAYS: "30"
  RESEND_FROM_EMAIL: noreply@example.com
  PASSWORD_RESET_TOKEN_EXPIRY_MIN: "60"
  GEMINI_MODEL: gemini-2.5-flash
  CHAT_RATE_LIMIT_MAX: "30"
  CHAT_RATE_LIMIT_WINDOW_MINUTES: "1"
  AUTO_MIGRATE: "true"
  LEGAL_IMPRESSUM_PATH: ""
  LEGAL_DATENSCHUTZ_PATH: ""
  IMPRESSUM_HTML: ""
  DATENSCHUTZ_HTML: ""
  BUY_ME_A_COFFEE_URL: ""
  LOG_LEVEL: info

# Sensitive data. Rendered as a Kubernetes Secret (or taken from an
# existing Secret) and injected via envFrom.
#
# Required keys: JWT_SECRET, DATABASE_URL
# Optional keys: REDIS_URL, RESEND_API_KEY, GEMINI_API_KEY
secrets:
  # If set, the chart does not create a Secret and the Pod uses this name.
  # The referenced Secret must contain at least JWT_SECRET and DATABASE_URL.
  existingSecret: ""
  JWT_SECRET: ""
  DATABASE_URL: ""
  REDIS_URL: ""
  RESEND_API_KEY: ""
  GEMINI_API_KEY: ""
