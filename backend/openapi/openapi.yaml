      tags: [Spieltage]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: playerId
