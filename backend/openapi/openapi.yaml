components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: JWT im HTTP-Only Cookie; für geschützte Endpunkte erforderlich. X-CSRF-Token Header bei Mutationen.
  schemas:
    CreateClubRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        balance: { type: integer, description: "Cent" }
        start_balance: { type: integer, description: "Cent" }
        base_fee: { type: integer, description: "Cent" }
        auto_tip_enabled: { type: boolean }
        couples_mode_enabled: { type: boolean }
    UpdateClubRequest:
      type: object
      properties:
        name: { type: string }
        balance: { type: integer }
        start_balance: { type: integer }
        base_fee: { type: integer }
        auto_tip_enabled: { type: boolean }
        couples_mode_enabled: { type: boolean }
