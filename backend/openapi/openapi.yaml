      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [fees]
              properties:
                fees:
                  type: array
                  items:
                    type: object
                    required: [penalty_type_id, count]
                    properties:
                      penalty_type_id: { type: string, format: uuid }
                      count: { type: number, example: 2 }
      responses:
        "200":
          description: Aktualisiert (aktuelle Strafen des Teilnehmers)
        "400":
          description: Ungültiger Strafentyp oder ungültige Menge (z. B. 1,5 bei einem Strafentyp ohne Dezimalmengen)
