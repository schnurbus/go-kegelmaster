components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: JWT im HTTP-Only Cookie; für geschützte Endpunkte erforderlich. X-CSRF-Token Header bei Mutationen.
    bearerAuth:
      type: http
      scheme: bearer
      description: Persönliches API-Token (`kgm_…`), erstellt unter „API-Tokens“. Kein CSRF-Header nötig.
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        password_changed_at:
          type: string
          format: date-time
          nullable: true
          description: Zeitpunkt der letzten Passwortänderung bzw. des letzten Resets; null, falls nie geändert.
    APIToken:
      type: object
      required: [id, name, token_prefix, expires_at, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        token_prefix: { type: string, description: "Erste Zeichen des Tokens zur Wiedererkennung", example: "kgm_AbCdEfGh" }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true, description: "Höchstens minütlich aktualisiert" }
        created_at: { type: string, format: date-time }
    CreatedAPIToken:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "Klartext-Token; wird nur einmal angezeigt", example: "kgm_…" }
    Passkey:
      type: object
      required: [id, name, transports, synced, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "iPhone" }
        transports:
          type: array
          items: { type: string, example: "internal" }
          description: Vom Authenticator gemeldete Transportwege (usb, nfc, ble, internal, hybrid)
        synced:
          type: boolean
          description: true für synchronisierte Passkeys (z. B. iCloud-Schlüsselbund), false für gerätegebundene Sicherheitsschlüssel
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    WebAuthnOptions:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: object
          description: |
            PublicKeyCredentialCreationOptionsJSON bzw. PublicKeyCredentialRequestOptionsJSON
            (Binärwerte base64url-kodiert); direkt an `PublicKeyCredential.parse…OptionsFromJSON()` übergeben.
    CreateClubRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        balance: { type: integer, description: "Cent" }
        start_balance: { type: integer, description: "Cent" }
        base_fee: { type: integer, description: "Cent" }
        auto_tip_enabled: { type: boolean }
        couples_mode_enabled: { type: boolean }
    UpdateClubRequest:
      type: object
      properties:
        name: { type: string }
        balance: { type: integer }
        start_balance: { type: integer }
        base_fee: { type: integer }
        auto_tip_enabled: { type: boolean }
        couples_mode_enabled: { type: boolean }
    PlayerStatistics:
      type: object
      description: Statistik eines Spielers. Beträge in Cent, Datumswerte als YYYY-MM-DD.
      properties:
        player:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        period:
          type: object
          properties:
            from: { type: string, format: date, nullable: true }
            to: { type: string, format: date }
        attendance:
          type: object
          properties:
            club_game_days: { type: integer, description: "Veröffentlichte Spieltage im Zeitraum" }
            attended: { type: integer }
            rate: { type: number, description: "Teilnahmequote 0..1" }
            current_streak: { type: integer }
            longest_streak: { type: integer }
            first_attended: { type: string, format: date, nullable: true }
            last_attended: { type: string, format: date, nullable: true }
        penalties:
          type: object
          properties:
            total_amount: { type: integer }
            average_per_game_day: { type: integer }
            club_average_per_game_day: { type: integer }
            penalty_free_game_days: { type: integer }
            most_expensive_game_day: { $ref: "#/components/schemas/StatisticsGameDayAmount" }
            cheapest_game_day: { $ref: "#/components/schemas/StatisticsGameDayAmount" }
            rank: { type: integer, description: "Platz nach Ø-Strafen pro Spieltag (1 = höchste), 0 = ohne Platz" }
            rank_of: { type: integer }
            by_type:
              type: array
              items:
                type: object
                properties:
                  penalty_type_id: { type: string, format: uuid }
                  name: { type: string }
                  quantity: { type: number }
                  amount: { type: integer }
                  game_days: { type: integer }
                  average_per_game_day: { type: number }
                  club_average_per_game_day: { type: number }
        competitions:
          type: array
          items:
            type: object
            properties:
              competition_id: { type: string, format: uuid }
              name: { type: string }
              scoring_type: { type: string, enum: [winner, loser, both] }
              is_gender_specific: { type: boolean }
              participations: { type: integer }
              total: { type: integer }
              average: { type: number }
              club_average: { type: number }
              best: { type: integer, nullable: true }
              worst: { type: integer, nullable: true }
              wins: { type: integer }
              losses: { type: integer }
              rank: { type: integer, description: "Platz nach Ø-Wert (1 = höchster), 0 = ohne Platz" }
              rank_of: { type: integer }
              history:
                type: array
                items:
                  type: object
                  properties:
                    game_day_id: { type: string, format: uuid }
                    date: { type: string, format: date }
                    value: { type: integer }
                    club_average: { type: number }
                    is_win: { type: boolean }
                    is_loss: { type: boolean }
        finance:
          type: object
          properties:
            start_balance: { type: integer }
            end_balance: { type: integer }
            deposits: { type: integer }
            fees: { type: integer }
            base_fees: { type: integer }
            balance_history:
              type: array
              items:
                type: object
                properties:
                  date: { type: string, format: date }
                  balance: { type: integer }
        game_days:
          type: array
          items:
            type: object
            properties:
              game_day_id: { type: string, format: uuid }
              date: { type: string, format: date }
              attended: { type: boolean }
              participants: { type: integer }
              penalty_amount: { type: integer, nullable: true }
              club_average_amount: { type: integer }
    StatisticsGameDayAmount:
      type: object
      nullable: true
      properties:
        game_day_id: { type: string, format: uuid }
        date: { type: string, format: date }
        amount: { type: integer }
