      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Gelöscht
  /api/clubs/{clubId}/players/{playerId}/transactions:
    get:
      summary: Transaktionen eines Spielers
      tags: [Transaktionen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: playerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transaktionsliste
  /api/clubs/{clubId}/gamedays/{gamedayId}/transactions:
    get:
      summary: Transaktionen eines Spieltags
      tags: [Transaktionen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: gamedayId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transaktionsliste
  /api/clubs/{clubId}/gamedays/{gamedayId}/transaction-summary:
    get:
      summary: Transaktions-Zusammenfassung Spieltag
      tags: [Transaktionen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: gamedayId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Summary
  /api/admin/stats:
    get:
      summary: Kennzahlen und Auffälligkeiten der Instanz
      description: |
        Dashboard der Betreiber-Übersicht. Definitionen: aktiv (Benutzer) = Login in den letzten 30 Tagen
        (`last_login_at`, vor Einführung unbekannt); aktiver Klub = Spieltag oder Transaktion in den letzten
        90 Tagen; inaktiver Klub = keine Aktivität seit 180 Tagen (ohne Aktivität: angelegt vor 180 Tagen);
        verwaist = Benutzer ohne eigenen Klub und ohne Spieler-Verknüpfung, älter als 30 Tage;
        Registrierungsspitze = mehr als 10 Registrierungen an einem Tag (UTC) in den letzten 30 Tagen.
        Audit: `admin_stats_viewed`.
      tags: [admin]
      security: [cookieAuth: []]
      responses:
        "200":
          description: Kennzahlen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStats" }
        "401":
          $ref: "#/components/responses/AdminReauthRequired"
        "404":
          $ref: "#/components/responses/AdminNotFound"
  /api/admin/users:
    get:
      summary: Benutzer auflisten
      description: |
        Serverseitig paginierte Benutzerliste mit Suche (Teilstring der E-Mail, ohne Groß-/Kleinschreibung),
        Filter und Sortierung. Ungültige Parameter liefern 400. Audit: `admin_users_listed`.
      tags: [admin]
      security: [cookieAuth: []]
      parameters:
        - $ref: "#/components/parameters/AdminSearch"
        - name: filter
          in: query
          description: "`orphaned` = verwaiste Konten (siehe /api/admin/stats), `admin` = Instanz-Admins, `disabled` = gesperrte Konten"
          schema: { type: string, enum: [orphaned, admin, disabled] }
        - name: sort
          in: query
          schema: { type: string, enum: [email, created_at, last_login_at], default: created_at }
        - name: order
          in: query
          description: "Standard: `asc` bei `email`, sonst `desc`. Bei `last_login_at` stehen unbekannte Logins bei `desc` am Ende."
          schema: { type: string, enum: [asc, desc] }
        - $ref: "#/components/parameters/AdminPage"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Seite der Benutzerliste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "400":
          description: Ungültiger Parameter
        "401":
          $ref: "#/components/responses/AdminReauthRequired"
        "404":
          $ref: "#/components/responses/AdminNotFound"
  /api/admin/users/{id}:
    get:
      summary: Benutzer-Detail
      description: |
        Stammdaten, eigene Klubs, Spieler-Verknüpfungen mit Rolle, API-Tokens (nie der Hash) und Passkeys.
        Audit: `admin_user_viewed`.
      tags: [admin]
      security: [cookieAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Benutzer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "401":
          $ref: "#/components/responses/AdminReauthRequired"
        "404":
          description: Kein Instanz-Admin oder Benutzer nicht gefunden
    delete:
      summary: Benutzer löschen
      description: |
        Löscht das Konto nach Bestätigung durch Eingabe seiner E-Mail-Adresse (ohne Groß-/Kleinschreibung).
        Passkeys, API-Tokens und Reset-Links werden mitgelöscht; verknüpfte Spieler bleiben in ihren Klubs
        (nur die Verknüpfung wird gelöst), Salden und Buchungen bleiben unverändert. Ist der Benutzer noch Owner
        eines Klubs, wird mit 409 abgelehnt: erst den Owner übertragen, sonst würde die Kaskade den Klub löschen.
        Das eigene Konto (400) und andere Instanz-Admins (409) können nicht gelöscht werden.
        Audit: `admin_user_deleted`.
      tags: [admin]
      security: [cookieAuth: []]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_email]
              properties:
                confirm_email: { type: string, description: E-Mail-Adresse des Kontos zur Bestätigung }
      responses:
        "204": { description: Gelöscht }
        "400": { description: Bestätigung stimmt nicht oder eigenes Konto }
        "403": { description: CSRF-Token ungültig }
        "404": { description: Kein Instanz-Admin oder Benutzer nicht gefunden }
        "409": { description: Benutzer ist noch Owner von Klubs oder Instanz-Admin }
  /api/admin/users/{id}/disable:
    post:
      summary: Benutzer sperren
      description: |
        Setzt `disabled_at`. Login (Passwort und Passkey) wird mit 403 abgelehnt, bestehende Browser-Sessions und
        API-Tokens mit 401. Die Browser-Sessions werden zusätzlich widerrufen (`sessions_valid_after`), damit ein
        späteres Entsperren sie nicht wiederbelebt. Das eigene Konto (400) und andere Instanz-Admins (409) können
        nicht gesperrt werden; die Admin-Rolle wird nur per CLI entzogen. Audit: `admin_user_disabled`.
      tags: [admin]
      security: [cookieAuth: []]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Gesperrt }
        "400": { description: Eigenes Konto }
        "403": { description: CSRF-Token ungültig }
        "404": { description: Kein Instanz-Admin oder Benutzer nicht gefunden }
        "409": { description: Ziel ist Instanz-Admin }
  /api/admin/users/{id}/enable:
    post:
      summary: Benutzer entsperren
      description: |
        Entfernt `disabled_at`. Der Benutzer muss sich neu anmelden; seine API-Tokens gelten wieder.
        Audit: `admin_user_enabled`.
      tags: [admin]
      security: [cookieAuth: []]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Entsperrt }
        "403": { description: CSRF-Token ungültig }
        "404": { description: Kein Instanz-Admin oder Benutzer nicht gefunden }
  /api/admin/users/{id}/revoke-sessions:
    post:
      summary: Browser-Sessions widerrufen
      description: |
        Setzt `sessions_valid_after` auf jetzt: alle vorher ausgestellten Browser-Sessions werden abgelehnt
        (zusätzlich zur Prüfung gegen `password_changed_at`). API-Tokens bleiben gültig und werden einzeln
        widerrufen. Nicht für das eigene Konto (400). Audit: `admin_sessions_revoked`.
      tags: [admin]
      security: [cookieAuth: []]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Sessions widerrufen }
        "400": { description: Eigenes Konto }
        "403": { description: CSRF-Token ungültig }
        "404": { description: Kein Instanz-Admin oder Benutzer nicht gefunden }
  /api/admin/users/{id}/tokens/{tokenId}:
    delete:
      summary: API-Token eines Benutzers widerrufen
      description: "Löscht das Token; es ist sofort ungültig. Audit: `admin_token_revoked`."
      tags: [admin]
      security: [cookieAuth: []]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
        - name: tokenId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204": { description: Token widerrufen }
        "403": { description: CSRF-Token ungültig }
        "404": { description: Kein Instanz-Admin oder Token (dieses Benutzers) nicht gefunden }
  /api/admin/clubs:
    get:
      summary: Klubs auflisten
      description: |
        Serverseitig paginierte Klubliste mit Owner, Spielerzahlen, Anzahl Spieltage und letzter Aktivität
        (`MAX(game_days.date, transactions.created_at)`). Suche über Klubname und Owner-E-Mail.
        Audit: `admin_clubs_listed`.
      tags: [admin]
      security: [cookieAuth: []]
      parameters:
        - $ref: "#/components/parameters/AdminSearch"
        - name: filter
          in: query
          description: "`inactive` = keine Aktivität seit 180 Tagen"
          schema: { type: string, enum: [inactive] }
        - name: sort
          in: query
          schema: { type: string, enum: [name, created_at, last_activity_at], default: name }
        - name: order
          in: query
          description: "Standard: `asc` bei `name`, sonst `desc`. Bei `last_activity_at` stehen Klubs ohne Aktivität bei `desc` am Ende."
          schema: { type: string, enum: [asc, desc] }
        - $ref: "#/components/parameters/AdminPage"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Seite der Klubliste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClubPage" }
        "400":
          description: Ungültiger Parameter
        "401":
          $ref: "#/components/responses/AdminReauthRequired"
        "404":
          $ref: "#/components/responses/AdminNotFound"
  /api/admin/clubs/{id}:
    get:
      summary: Klub-Detail
      description: |
        Owner, Spieler mit verknüpftem Benutzer und Rolle, offene Einladungen, Rollen mit Spieleranzahl.
        Bewusst **keine** Fachdaten (Salden, Transaktionen, Strafen einzelner Spieler), nur aggregierte Anzahlen.
        Audit: `admin_club_viewed`.
      tags: [admin]
      security: [cookieAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Klub
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClubDetail" }
        "401":
          $ref: "#/components/responses/AdminReauthRequired"
        "404":
          description: Kein Instanz-Admin oder Klub nicht gefunden
    delete:
      summary: Klub löschen
      description: |
        Löscht den Klub samt allen Fachdaten (Spieler, Rollen, Spieltage, Transaktionen usw. per Kaskade) nach
        Bestätigung durch Eingabe des exakten Klubnamens. Audit: `admin_club_deleted`.
      tags: [admin]
      security: [cookieAuth: []]
      parameters:
        - $ref: "#/components/parameters/AdminClubId"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_name]
              properties:
                confirm_name: { type: string, description: Name des Klubs zur Bestätigung }
      responses:
        "204": { description: Gelöscht }
        "400": { description: Bestätigung stimmt nicht }
        "403": { description: CSRF-Token ungültig }
        "404": { description: Kein Instanz-Admin oder Klub nicht gefunden }
  /api/admin/clubs/{id}/transfer-owner:
    post:
      summary: Klub-Owner übertragen
      description: |
        Macht ein anderes, nicht gesperrtes Konto zum Owner (gleiche Logik wie `POST /api/clubs/{id}/transfer-owner`,
        aber ohne Owner- und Passwortprüfung), z. B. wenn der Owner nicht mehr erreichbar ist oder gelöscht werden soll.
        Der Admin wird dadurch nicht Mitglied des Klubs. Audit: `admin_club_owner_transferred`.
      tags: [admin]
      security: [cookieAuth: []]
      parameters:
        - $ref: "#/components/parameters/AdminClubId"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_owner_email]
              properties:
                new_owner_email: { type: string, format: email }
      responses:
        "200":
          description: Neuer Owner
          content:
            application/json:
              schema:
                type: object
                required: [club_id, owner]
                properties:
                  club_id: { type: string, format: uuid }
                  owner: { $ref: "#/components/schemas/AdminUserRef" }
        "400": { description: Ungültige E-Mail, Konto existiert nicht, ist gesperrt oder bereits Owner }
        "403": { description: CSRF-Token ungültig }
        "404": { description: Kein Instanz-Admin oder Klub nicht gefunden }
  /api/admin/export/memberships.csv:
    get:
      summary: Verknüpfungen als CSV exportieren
      description: |
        Eine Zeile pro Spieler, der mit einem Benutzer verknüpft ist, plus eine Zeile pro Klub, in dem der Owner
        keinen eigenen Spieler hat (`player_name` und `role_name` leer). Benutzer ohne Klub erscheinen nicht.
        Werte, die mit `=`, `+`, `-` oder `@` beginnen, erhalten ein vorangestelltes `'` (Schutz vor CSV-Injection).
        Audit: `admin_export`.
      tags: [admin]
      security: [cookieAuth: []]
      responses:
        "200":
          description: CSV (UTF-8, kommagetrennt, Kopfzeile `user_email,club_name,is_owner,player_name,role_name`)
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="memberships-2026-11-19.csv"' }
          content:
            text/csv:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/AdminReauthRequired"
        "404":
          $ref: "#/components/responses/AdminNotFound"
components:
  parameters:
    AdminUserId:
      name: id
      in: path
      required: true
      description: ID des Benutzers
      schema: { type: string, format: uuid }
    AdminClubId:
      name: id
      in: path
      required: true
      description: ID des Klubs
      schema: { type: string, format: uuid }
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Wert des Cookies `csrf_token`
      schema: { type: string }
    AdminSearch:
      name: search
      in: query
      description: Suchbegriff (Teilstring, ohne Groß-/Kleinschreibung, max. 200 Zeichen)
      schema: { type: string, maxLength: 200 }
    AdminPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    AdminLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    AdminNotFound:
      description: |
        Kein Instanz-Admin, nicht angemeldet oder Anfrage mit `Authorization: Bearer` (API-Token/MCP).
        Bewusst 404 statt 401/403.
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: "Not Found" }
    AdminReauthRequired:
      description: |
        Instanz-Admin, dessen letzte echte Anmeldung länger als `ADMIN_REAUTH_MINUTES` zurückliegt
        (oder Session-Cookie ohne `auth_time`). Die Anmeldung muss über `POST /api/auth/reauth`
        (Passwort) oder `POST /api/auth/passkeys/reauth` (Passkey) bestätigt werden.
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error: { type: string, enum: [reauth_required] }
              message: { type: string, example: "Erneute Anmeldung erforderlich, um den Admin-Bereich zu nutzen." }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: JWT im HTTP-Only Cookie; für geschützte Endpunkte erforderlich. X-CSRF-Token Header bei Mutationen.
    bearerAuth:
      type: http
      scheme: bearer
      description: Persönliches API-Token (`kgm_…`), erstellt unter „API-Tokens“. Kein CSRF-Header nötig.
    oauth2:
      type: oauth2
      description: |
        OAuth 2.1 für MCP-Clients (nur `/mcp`). Öffentliche Clients registrieren sich dynamisch
        (`POST /oauth/register`); Authorization Code mit PKCE (S256) ist Pflicht. Access Tokens
        (`kgo_…`) gelten 1 Stunde und nur für den MCP-Server, Refresh Tokens (`kgr_…`) 30 Tage
        und rotieren bei jeder Verwendung.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            mcp: Zugriff auf den MCP-Server mit den Rechten des Benutzers
  schemas:
    OAuthError:
      type: object
      description: Fehlerantwort gemäß RFC 6749 bzw. RFC 7591.
      properties:
        error:
          type: string
          example: invalid_grant
          description: z. B. invalid_request, invalid_client, invalid_grant, invalid_scope, invalid_target, unsupported_grant_type, invalid_redirect_uri, invalid_client_metadata
        error_description: { type: string }
    OAuthGrant:
      type: object
      description: Verbundene Anwendung (per OAuth erteilter Zugriff).
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        client_name: { type: string, example: "Claude" }
        redirect_host: { type: string, example: "claude.ai" }
        scope: { type: string, example: "mcp" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    OAuthAuthorizeParams:
      type: object
      required: [client_id, redirect_uri, response_type, code_challenge, code_challenge_method]
      properties:
        client_id: { type: string, format: uuid }
        redirect_uri: { type: string, description: Muss exakt einer registrierten redirect_uri entsprechen. }
        response_type: { type: string, enum: [code] }
        code_challenge: { type: string, description: "BASE64URL(SHA256(code_verifier)), 43 Zeichen" }
        code_challenge_method: { type: string, enum: [S256] }
        state: { type: string, maxLength: 1024 }
        scope: { type: string, description: Wird syntaktisch geprüft; erteilt wird immer `mcp`. }
        resource: { type: string, description: "RFC 8707; falls gesetzt, muss es `<PUBLIC_BASE_URL>/mcp` sein." }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        password_changed_at:
          type: string
          format: date-time
          nullable: true
          description: Zeitpunkt der letzten Passwortänderung bzw. des letzten Resets; null, falls nie geändert.
        notify_gameday_settled:
          type: boolean
          description: |
            E-Mail-Benachrichtigung, sobald ein Spieltag eines Clubs, in dem der User einen Spieler hat,
            abgerechnet (veröffentlicht) wurde. Standard: false.
        is_instance_admin:
          type: boolean
          description: |
            true, wenn der User Instanz-Admin (Betreiber) ist und den Bereich `/api/admin` nutzen darf.
            Wird nur per CLI (`kegelmaster admin grant`) oder `INSTANCE_ADMIN_EMAILS` vergeben.
        tour_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Rundgang gesehen (beendet oder übersprungen); null = startet automatisch.
        setup_hint_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Sprechblase zur Ersteinrichtung-Karte gesehen; null = noch nicht.
    ClubSetup:
      type: object
      required: [dismissed, complete, steps]
      properties:
        dismissed: { type: boolean, description: Ersteinrichtung-Karte ausgeblendet }
        complete: { type: boolean, description: Alle Pflichtschritte erledigt }
        steps:
          type: array
          items:
            type: object
            required: [id, required, done]
            properties:
              id:
                type: string
                enum: [club, penalty_types, roles, players, first_game_day, own_player, invitations, competitions]
              required: { type: boolean }
              done: { type: boolean }
    AdminStats:
      type: object
      required: [users, clubs, players, open_invitations, api_tokens, passkeys, anomalies]
      properties:
        users:
          type: object
          required: [total, new_7d, new_30d, active_30d, instance_admins, disabled]
          properties:
            total: { type: integer }
            new_7d: { type: integer, description: Registriert in den letzten 7 Tagen }
            new_30d: { type: integer, description: Registriert in den letzten 30 Tagen }
            active_30d: { type: integer, description: Login in den letzten 30 Tagen }
            instance_admins: { type: integer }
            disabled: { type: integer, description: Gesperrte Konten }
        clubs:
          type: object
          required: [total, active_90d]
          properties:
            total: { type: integer }
            active_90d: { type: integer, description: Spieltag oder Transaktion in den letzten 90 Tagen }
        players:
          type: object
          required: [total, linked]
          properties:
            total: { type: integer }
            linked: { type: integer, description: Mit einem Benutzer verknüpft }
        open_invitations: { type: integer, description: Nicht angenommen und nicht abgelaufen }
        api_tokens:
          type: object
          required: [active]
          properties:
            active: { type: integer, description: Nicht abgelaufen (inkl. ohne Ablaufdatum) }
        passkeys: { type: integer }
        anomalies:
          type: object
          required: [orphaned_users, inactive_clubs, api_tokens_without_expiry, api_tokens_unused_90d, registration_spikes]
          properties:
            orphaned_users: { type: integer, description: Ohne Klub und Spieler-Verknüpfung, älter als 30 Tage }
            inactive_clubs: { type: integer, description: Keine Aktivität seit 180 Tagen }
            api_tokens_without_expiry: { type: integer }
            api_tokens_unused_90d: { type: integer, description: Aktiv, aber seit 90 Tagen (bzw. seit Erstellung) ungenutzt }
            registration_spikes:
              type: array
              description: Tage (UTC) der letzten 30 Tage mit mehr als 10 Registrierungen, neueste zuerst
              items:
                type: object
                required: [date, registrations]
                properties:
                  date: { type: string, format: date }
                  registrations: { type: integer }
    AdminUserRef:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
    AdminUserListItem:
      type: object
      required: [id, email, is_instance_admin, orphaned, created_at, last_login_at, disabled_at, owned_club_count, player_club_count, passkey_count, api_token_count]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        is_instance_admin: { type: boolean }
        orphaned: { type: boolean, description: Ohne Klub und Spieler-Verknüpfung, älter als 30 Tage }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true, description: null = unbekannt }
        disabled_at: { type: string, format: date-time, nullable: true, description: Gesperrt seit (null = aktiv) }
        owned_club_count: { type: integer, description: Anzahl Klubs, deren Owner der Benutzer ist }
        player_club_count: { type: integer, description: Anzahl Klubs, in denen ein Spieler mit dem Benutzer verknüpft ist }
        passkey_count: { type: integer }
        api_token_count: { type: integer }
    AdminUserPage:
      type: object
      required: [data, page, limit, total, total_pages]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminUserListItem" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    AdminUserDetail:
      type: object
      required: [id, email, is_instance_admin, orphaned, created_at, updated_at, password_changed_at, last_login_at, disabled_at, sessions_valid_after, owned_clubs, players, api_tokens, passkeys]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        is_instance_admin: { type: boolean }
        orphaned: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        password_changed_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true, description: Gesperrt seit (null = aktiv) }
        sessions_valid_after: { type: string, format: date-time, nullable: true, description: Browser-Sessions davor wurden widerrufen }
        owned_clubs:
          type: array
          items:
            type: object
            required: [id, name, created_at, player_count]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              created_at: { type: string, format: date-time }
              player_count: { type: integer }
        players:
          type: array
          description: Spieler, die mit dem Benutzer verknüpft sind
          items:
            type: object
            required: [player_id, player_name, inactive, club_id, club_name, is_owner, role_id, role_name]
            properties:
              player_id: { type: string, format: uuid }
              player_name: { type: string }
              inactive: { type: boolean }
              club_id: { type: string, format: uuid }
              club_name: { type: string }
              is_owner: { type: boolean, description: Der Benutzer ist auch Owner dieses Klubs }
              role_id: { type: string, format: uuid, nullable: true }
              role_name: { type: string, nullable: true }
        api_tokens:
          type: array
          description: Ohne Token-Hash
          items:
            type: object
            required: [id, name, token_prefix, created_at, expires_at, last_used_at]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              token_prefix: { type: string, example: "kgm_AbCdEfGh" }
              created_at: { type: string, format: date-time }
              expires_at: { type: string, format: date-time, nullable: true }
              last_used_at: { type: string, format: date-time, nullable: true }
        passkeys:
          type: array
          items:
            type: object
            required: [id, name, created_at, last_used_at]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              created_at: { type: string, format: date-time }
              last_used_at: { type: string, format: date-time, nullable: true }
    AdminClubListItem:
      type: object
      required: [id, name, created_at, owner, player_count, linked_player_count, game_day_count, last_activity_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        owner: { $ref: "#/components/schemas/AdminUserRef" }
        player_count: { type: integer }
        linked_player_count: { type: integer, description: Spieler mit verknüpftem Benutzer }
        game_day_count: { type: integer, description: Alle Spieltage inkl. Entwürfe }
        last_activity_at: { type: string, format: date-time, nullable: true, description: null = noch keine Aktivität }
    AdminClubPage:
      type: object
      required: [data, page, limit, total, total_pages]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminClubListItem" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    AdminClubDetail:
      allOf:
        - $ref: "#/components/schemas/AdminClubListItem"
        - type: object
          required: [transaction_count, players, open_invitations, roles]
          properties:
            transaction_count: { type: integer, description: Nur die Anzahl, keine Beträge }
            players:
              type: array
              items:
                type: object
                required: [id, name, inactive, created_at, user, role_id, role_name]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  inactive: { type: boolean }
                  created_at: { type: string, format: date-time }
                  user:
                    allOf: [{ $ref: "#/components/schemas/AdminUserRef" }]
                    nullable: true
                    description: Verknüpfter Benutzer; null = nicht verknüpft
                  role_id: { type: string, format: uuid, nullable: true }
                  role_name: { type: string, nullable: true }
            open_invitations:
              type: array
              description: Nicht angenommen und nicht abgelaufen
              items:
                type: object
                required: [id, player_id, player_name, email, created_at, expires_at]
                properties:
                  id: { type: string, format: uuid }
                  player_id: { type: string, format: uuid }
                  player_name: { type: string }
                  email: { type: string, format: email, description: Eingeladene E-Mail }
                  created_at: { type: string, format: date-time }
                  expires_at: { type: string, format: date-time }
            roles:
              type: array
              items:
                type: object
                required: [id, name, player_count]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  player_count: { type: integer }
    APIToken:
      type: object
      required: [id, name, token_prefix, expires_at, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        token_prefix: { type: string, description: "Erste Zeichen des Tokens zur Wiedererkennung", example: "kgm_AbCdEfGh" }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true, description: "Höchstens minütlich aktualisiert" }
        created_at: { type: string, format: date-time }
    CreatedAPIToken:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "Klartext-Token; wird nur einmal angezeigt", example: "kgm_…" }
    Passkey:
      type: object
      required: [id, name, transports, synced, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "iPhone" }
        transports:
          type: array
          items: { type: string, example: "internal" }
          description: Vom Authenticator gemeldete Transportwege (usb, nfc, ble, internal, hybrid)
        synced:
          type: boolean
          description: true für synchronisierte Passkeys (z. B. iCloud-Schlüsselbund), false für gerätegebundene Sicherheitsschlüssel
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    WebAuthnOptions:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: object
          description: |
            PublicKeyCredentialCreationOptionsJSON bzw. PublicKeyCredentialRequestOptionsJSON
            (Binärwerte base64url-kodiert); direkt an `PublicKeyCredential.parse…OptionsFromJSON()` übergeben.
    CreateClubRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        balance: { type: integer, description: "Cent" }
        start_balance: { type: integer, description: "Cent" }
        base_fee: { type: integer, description: "Cent" }
        auto_tip_enabled: { type: boolean }
        couples_mode_enabled: { type: boolean }
    UpdateClubRequest:
      type: object
      properties:
        name: { type: string }
        balance: { type: integer }
        start_balance: { type: integer }
        base_fee: { type: integer }
        auto_tip_enabled: { type: boolean }
        couples_mode_enabled: { type: boolean }
    PlayerStatistics:
      type: object
      description: Statistik eines Spielers. Beträge in Cent, Datumswerte als YYYY-MM-DD.
      properties:
        player:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        period:
          type: object
          properties:
            from: { type: string, format: date, nullable: true }
            to: { type: string, format: date }
        attendance:
          type: object
          properties:
            club_game_days: { type: integer, description: "Veröffentlichte Spieltage im Zeitraum" }
            attended: { type: integer }
            rate: { type: number, description: "Teilnahmequote 0..1" }
            current_streak: { type: integer }
            longest_streak: { type: integer }
            first_attended: { type: string, format: date, nullable: true }
            last_attended: { type: string, format: date, nullable: true }
        penalties:
          type: object
          properties:
            total_amount: { type: integer, description: "inkl. Strafen bei Abwesenheit" }
            absent_amount: { type: integer, description: "Anteil von total_amount, der bei Abwesenheit gebucht wurde" }
            average_per_game_day: { type: integer, description: "total_amount pro anwesendem Spieltag" }
            club_average_per_game_day: { type: integer }
            penalty_free_game_days: { type: integer }
            most_expensive_game_day: { $ref: "#/components/schemas/StatisticsGameDayAmount" }
            cheapest_game_day: { $ref: "#/components/schemas/StatisticsGameDayAmount" }
            rank: { type: integer, description: "Platz nach Ø-Strafen pro Spieltag (1 = höchste), 0 = ohne Platz" }
            rank_of: { type: integer }
            by_type:
              type: array
              items:
                type: object
                properties:
                  penalty_type_id: { type: string, format: uuid }
                  name: { type: string }
                  quantity: { type: number }
                  amount: { type: integer }
                  game_days: { type: integer }
                  average_per_game_day: { type: number }
                  club_average_per_game_day: { type: number }
        competitions:
          type: array
          items:
            type: object
            properties:
              competition_id: { type: string, format: uuid }
              name: { type: string }
              scoring_type: { type: string, enum: [winner, loser, both] }
              is_gender_specific: { type: boolean }
              participations: { type: integer }
              total: { type: integer }
              average: { type: number }
              club_average: { type: number }
              best: { type: integer, nullable: true }
              worst: { type: integer, nullable: true }
              wins: { type: integer }
              losses: { type: integer }
              rank: { type: integer, description: "Platz nach Ø-Wert (1 = höchster), 0 = ohne Platz" }
              rank_of: { type: integer }
              history:
                type: array
                items:
                  type: object
                  properties:
                    game_day_id: { type: string, format: uuid }
                    date: { type: string, format: date }
                    value: { type: integer }
                    club_average: { type: number }
                    is_win: { type: boolean }
                    is_loss: { type: boolean }
        finance:
          type: object
          properties:
            start_balance: { type: integer }
            end_balance: { type: integer }
            deposits: { type: integer }
            fees: { type: integer }
            base_fees: { type: integer }
            balance_history:
              type: array
              items:
                type: object
                properties:
                  date: { type: string, format: date }
                  balance: { type: integer }
        game_days:
          type: array
          items:
            type: object
            properties:
              game_day_id: { type: string, format: uuid }
              date: { type: string, format: date }
              attended: { type: boolean }
              participants: { type: integer }
              penalty_amount: { type: integer, nullable: true }
              club_average_amount: { type: integer }
    StatisticsGameDayAmount:
      type: object
      nullable: true
      properties:
        game_day_id: { type: string, format: uuid }
        date: { type: string, format: date }
        amount: { type: integer }
