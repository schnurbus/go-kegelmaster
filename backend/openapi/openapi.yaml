          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transaktion
    put:
      summary: Transaktion bearbeiten
      description: |
        Bearbeitet eine manuelle Transaktion (Einzahlung, Trinkgeld, Ausgabe). Benötigt die Berechtigung
        `transactions/update`. Die Wirkung der alten Buchung auf Spieler- und Klubsaldo wird in derselben
        Datenbanktransaktion zurückgenommen und die neue angewendet. Es gibt keine Auto-Tip-Aufteilung und
        keinen Paar-Modus: der Betrag wird genau so gebucht. Grund- und Strafgebühren (vom Spieltag erzeugt)
        können nicht bearbeitet werden (400).
      tags: [Transaktionen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_type, amount]
              properties:
