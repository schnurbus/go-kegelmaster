openapi: 3.0.3
info:
  title: Kegelmaster API
  description: |
    API für die Kegelmaster-App (Spieler, Spieltage, Transaktionen, Clubs).

    **Authentifizierung** – zwei gleichwertige Wege:

    * **Browser-Session:** `POST /api/auth/login` setzt das HTTP-Only-Cookie `auth_token`.
      Mutationen (POST/PUT/PATCH/DELETE) brauchen zusätzlich den Header `X-CSRF-Token`
      mit dem Wert des Cookies `csrf_token` (abrufbar über `GET /api/auth/csrf-token`).
    * **Persönliches API-Token** (für Skripte und Agenten): in der Weboberfläche unter
      „API-Tokens“ erstellen und als `Authorization: Bearer kgm_…` senden. Kein CSRF-Header
      nötig. Das Token hat dieselben Rechte wie sein Benutzer. Ist der Header gesetzt, wird
      ausschließlich das Token geprüft (kein Rückfall auf das Cookie). Tokens verfallen
      optional nach 1–365 Tagen und werden beim Zurücksetzen des Passworts widerrufen.
      Die Token-Verwaltung (`/api/auth/tokens`) ist nur mit Browser-Session möglich.
  version: 0.1.0
servers:
  - url: ""
    description: App-Origin (Health unter /healthz, API unter /api)
paths:
  /mcp:
    post:
      summary: MCP-Server für KI-Agenten (Model Context Protocol)
      description: |
        Streamable-HTTP-Endpunkt (zustandslos, JSON-Antworten) des Model Context Protocol. Nur mit
        persönlichem API-Token (`Authorization: Bearer kgm_…`); ein Session-Cookie reicht nicht.
        Jedes Tool ruft intern die REST-API mit diesem Token auf – es gelten dieselben Rechte.

        Tools: `klubs_auflisten`, `klub_ueberblick`, `spieltage_auflisten`, `spieltag_details`,
        `spieler_konto`, `transaktionen_suchen`, `mein_spieler` (nur lesend), `spieltag_erfassen`
        (legt einen Entwurf an, bucht nichts), `spieltag_veroeffentlichen` und `buchung_erfassen`
        (buchen Geld).

        Einrichtung z. B. in Claude Code:
        `claude mcp add --transport http kegelmaster https://<host>/mcp --header "Authorization: Bearer kgm_…"`
      tags: [MCP]
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC-2.0-Nachricht gemäß MCP-Spezifikation
      responses:
        "200":
          description: JSON-RPC-Antwort
        "401":
          description: Kein oder ungültiges API-Token
  /healthz:
    get:
      summary: Health Check
      tags: [System]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, example: "ok" }
                  version: { type: string, description: "App-Version (Build-Info)" }
  /api/config/public:
    get:
      summary: Öffentliche Konfiguration für das Frontend
      description: Liefert Version und optionale URLs (z. B. Buy Me a Coffee). Keine Authentifizierung.
      tags: [System]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string, description: "App-Version (Build-Info)" }
                  buy_me_a_coffee_url: { type: string, format: uri, description: "Nur gesetzt wenn BUY_ME_A_COFFEE_URL konfiguriert ist." }
  /api/auth/csrf-token:
    get:
      summary: CSRF-Token abrufen
      tags: [Auth]
      responses:
        "200":
          description: Token (Cookie + JSON-Body)
  /api/auth/me:
    get:
      summary: Angemeldeten User abrufen
      tags: [Auth]
      security: [cookieAuth: [], bearerAuth: []]
      responses:
        "200":
          description: User-Objekt
        "401":
          description: Nicht angemeldet
  /api/auth/register:
    post:
      summary: Registrieren und einloggen
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "201":
          description: User angelegt und eingeloggt
        "400":
          description: Ungültige Anfrage
  /api/auth/login:
    post:
      summary: Login (setzt HTTP-Only Cookie)
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Erfolgreich eingeloggt
        "401":
          description: Anmeldung fehlgeschlagen
        "429":
          description: Zu viele Anmeldeversuche (Rate-Limit pro Client-IP)
  /api/auth/logout:
    post:
      summary: Logout (Cookie löschen)
      tags: [Auth]
      responses:
        "204":
          description: Erfolgreich abgemeldet
  /api/auth/tokens:
    get:
      summary: Eigene API-Tokens auflisten
      description: Liefert die Tokens des angemeldeten Users ohne Geheimnis. Nur mit Browser-Session (403 bei Bearer-Auth).
      tags: [Auth]
      security: [cookieAuth: []]
      responses:
        "200":
          description: Liste der Tokens (neueste zuerst)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIToken" }
        "401":
          description: Nicht angemeldet
        "403":
          description: Mit API-Token aufgerufen
    post:
      summary: API-Token erstellen
      description: |
        Erstellt ein persönliches API-Token. Das Klartext-Token steht nur in dieser Antwort und
        kann später nicht erneut abgerufen werden. Maximal 20 Tokens pro User.
        Nur mit Browser-Session (403 bei Bearer-Auth); X-CSRF-Token erforderlich.
      tags: [Auth]
      security: [cookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100, example: "Kassen-Agent" }
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  nullable: true
                  description: Gültigkeit in Tagen; weglassen oder null für unbegrenzt.
      responses:
        "201":
          description: Token erstellt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIToken" }
        "400":
          description: Ungültiger Name oder ungültige Gültigkeit
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig oder mit API-Token aufgerufen
        "409":
          description: Maximale Anzahl an Tokens erreicht
  /api/auth/tokens/{id}:
    delete:
      summary: API-Token widerrufen
      description: Löscht ein eigenes Token; es ist sofort ungültig. Nur mit Browser-Session; X-CSRF-Token erforderlich.
      tags: [Auth]
      security: [cookieAuth: []]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Widerrufen
        "400":
          description: Ungültige Token-ID
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig oder mit API-Token aufgerufen
        "404":
          description: Token nicht gefunden (oder gehört einem anderen User)
  /api/auth/forgot-password:
    post:
      summary: Passwort vergessen (E-Mail mit Reset-Link)
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204":
          description: E-Mail gesendet (oder ignoriert bei unbekannter Adresse)
        "429":
          description: Rate Limit
  /api/auth/reset-password:
    post:
      summary: Passwort zurücksetzen
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "204":
          description: Passwort geändert
        "400":
          description: Ungültiger oder abgelaufener Token
  /api/chat:
    post:
      summary: Hilfe-Chat (Assistent)
      tags: [Chat]
      security: [cookieAuth: [], bearerAuth: []]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                history: { type: array, items: { type: object, properties: { role: { type: string }, text: { type: string } } } }
                current_page: { type: string }
      responses:
        "200":
          description: Antwort des Assistenten
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
        "503":
          description: Chat nicht verfügbar (z. B. API-Key fehlt)
        "429":
          description: Rate Limit
  /api/legal/impressum:
    get:
      summary: Impressum (HTML, öffentlich)
      tags: [Legal]
      responses:
        "200":
          description: "HTML-Inhalt (aus Konfiguration: Datei oder Umgebungsvariable)"
          content:
            text/html:
              schema:
                type: string
  /api/legal/datenschutz:
    get:
      summary: Datenschutzerklärung (HTML, öffentlich)
      tags: [Legal]
      responses:
        "200":
          description: "HTML-Inhalt (aus Konfiguration: Datei oder Umgebungsvariable)"
          content:
            text/html:
              schema:
                type: string
  /api/clubs:
    get:
      summary: Alle Clubs des Users
      tags: [Clubs]
      security: [cookieAuth: [], bearerAuth: []]
      responses:
        "200":
          description: Liste der Clubs
    post:
      summary: Club anlegen
      tags: [Clubs]
      security: [cookieAuth: [], bearerAuth: []]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClubRequest"
      responses:
        "201":
          description: Club erstellt
        "400":
          description: Validierungsfehler
  /api/clubs/{id}:
    get:
      summary: Einzelnen Club abrufen
      tags: [Clubs]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Club
        "404":
          description: Nicht gefunden
    put:
      summary: Club aktualisieren (nur Owner)
      tags: [Clubs]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClubRequest"
      responses:
        "200":
          description: Aktualisiert
        "403":
          description: Kein Owner
    delete:
      summary: Club löschen (nur Owner)
      tags: [Clubs]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Gelöscht
        "403":
          description: Kein Owner
  /api/clubs/{id}/recalculate-balance:
    post:
      summary: Club-Saldo neu berechnen
      tags: [Clubs]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Neuberechnung durchgeführt
  /api/clubs/{id}/transfer-owner:
    post:
      summary: Besitzer übertragen
      tags: [Clubs]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [new_owner_user_id]
              properties:
                new_owner_user_id: { type: string, format: uuid }
      responses:
        "200":
          description: Übertragen
        "403":
          description: Kein Owner
  /api/clubs/{clubId}/permissions/me:
    get:
      summary: Eigene Berechtigungen im Club
      tags: [Clubs]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Berechtigungen
  /api/clubs/{clubId}/roles:
    get:
      summary: Rollen des Clubs
      tags: [Rollen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rollenliste
    post:
      summary: Rolle anlegen
      tags: [Rollen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Rolle erstellt
  /api/clubs/{clubId}/roles/{id}:
    get:
      summary: Einzelne Rolle
      tags: [Rollen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rolle
    put:
      summary: Rolle aktualisieren
      tags: [Rollen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: Aktualisiert
    delete:
      summary: Rolle löschen
      tags: [Rollen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Gelöscht
  /api/clubs/{clubId}/roles/{id}/permissions:
    post:
      summary: Berechtigung zu Rolle hinzufügen
      tags: [Rollen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, permission_type]
              properties:
                entity_type: { type: string }
                permission_type: { type: string }
      responses:
        "200":
          description: Berechtigung hinzugefügt
    delete:
      summary: Berechtigung von Rolle entfernen
      tags: [Rollen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, permission_type]
              properties:
                entity_type: { type: string }
                permission_type: { type: string }
      responses:
        "200":
          description: Berechtigung entfernt
  /api/clubs/{clubId}/players:
    get:
      summary: Spieler des Clubs
      tags: [Spieler]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Spielerliste (jeweils id, club_id, name, balance, start_balance, role_id, gender, inactive, partner_id, pair_balance optional bei Partner)
    post:
      summary: Spieler anlegen
      tags: [Spieler]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, role_id]
              properties:
                name: { type: string }
                role_id: { type: string, format: uuid }
                gender: { type: string }
                inactive: { type: boolean }
      responses:
        "201":
          description: Spieler erstellt
  /api/clubs/{clubId}/players/me:
    get:
      summary: Eigenen Spieler-Datensatz (verknüpfter User)
      tags: [Spieler]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Spieler (inkl. optional partner_id, pair_balance bei Paar-Modus)
  /api/clubs/{clubId}/players/me/penalty-history:
    get:
      summary: Eigene Strafen-Historie
      tags: [Spieler]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Historie
  /api/clubs/{clubId}/players/me/competition-history:
    get:
      summary: Eigene Wettbewerbs-Historie
      tags: [Spieler]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Historie
  /api/clubs/{clubId}/players/{id}:
    get:
      summary: Einzelnen Spieler
      tags: [Spieler]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Spieler (inkl. optional partner_id, pair_balance bei Paar-Modus)
    put:
      summary: Spieler aktualisieren
      tags: [Spieler]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role_id: { type: string, format: uuid }
                gender: { type: string }
                inactive: { type: boolean }
                partner_id: { type: string, format: uuid, nullable: true, description: "Optionaler Partner (Paar-Modus); null = keinen Partner" }
      responses:
        "200":
          description: Aktualisiert (enthält optional pair_balance wenn Spieler einen Partner hat)
    delete:
      summary: Spieler löschen
      tags: [Spieler]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Gelöscht
  /api/clubs/{clubId}/players/{id}/recalculate-balance:
    post:
      summary: Spieler-Saldo neu berechnen
      tags: [Spieler]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Neuberechnung durchgeführt
  /api/clubs/{clubId}/players/{id}/invite:
    post:
      summary: Einladung an Spieler senden
      tags: [Spieler]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Einladung versendet
  /api/invitations/{token}:
    get:
      summary: Einladung abrufen (Token)
      tags: [Einladungen]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Einladungsdetails
        "404":
          description: Ungültiger Token
  /api/invitations/{token}/accept:
    post:
      summary: Einladung annehmen
      tags: [Einladungen]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Account erstellt und eingeloggt
        "400":
          description: Ungültig oder abgelaufen
        "409":
          description: Spieler ist bereits verknüpft oder der User hat im Klub bereits einen Spieler
        "410":
          description: Einladung abgelaufen oder bereits angenommen
  /api/clubs/{clubId}/penalty-types:
    get:
      summary: Strafentypen des Clubs
      tags: [Strafentypen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Liste Strafentypen
    post:
      summary: Strafentyp anlegen
      tags: [Strafentypen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, fee]
              properties:
                name: { type: string }
                fee: { type: integer, description: "Gebühr in Cent" }
      responses:
        "201":
          description: Strafentyp erstellt
  /api/clubs/{clubId}/penalty-types/{id}:
    get:
      summary: Einzelnen Strafentyp
      tags: [Strafentypen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Strafentyp
    put:
      summary: Strafentyp aktualisieren
      tags: [Strafentypen]
      security: [cookieAuth: [], bearerAuth: []]
      parameters:
        - name: clubId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                fee: { type: integer }
      responses:
