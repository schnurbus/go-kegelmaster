openapi: 3.0.3
info:
  title: Kegelmaster API
  description: |
    API für die Kegelmaster-App (Spieler, Spieltage, Transaktionen, Clubs).

    **Authentifizierung** – zwei gleichwertige Wege:

    * **Browser-Session:** `POST /api/auth/login` setzt das HTTP-Only-Cookie `auth_token`.
      Mutationen (POST/PUT/PATCH/DELETE) brauchen zusätzlich den Header `X-CSRF-Token`
      mit dem Wert des Cookies `csrf_token` (abrufbar über `GET /api/auth/csrf-token`).
    * **Persönliches API-Token** (für Skripte und Agenten): in der Weboberfläche unter
      „API-Tokens“ erstellen und als `Authorization: Bearer kgm_…` senden. Kein CSRF-Header
      nötig. Das Token hat dieselben Rechte wie sein Benutzer. Ist der Header gesetzt, wird
      ausschließlich das Token geprüft (kein Rückfall auf das Cookie). Tokens verfallen
      optional nach 1–365 Tagen und werden beim Zurücksetzen des Passworts widerrufen.
      Die Token-Verwaltung (`/api/auth/tokens`) ist nur mit Browser-Session möglich.

    **OAuth 2.1 für MCP-Clients** (Tag `OAuth`): Kegelmaster ist eigener Authorization Server
    (Issuer = `PUBLIC_BASE_URL`) mit dynamischer Client-Registrierung, Authorization Code + PKCE (S256)
    und rotierenden Refresh Tokens. Die so ausgestellten Access Tokens (`kgo_…`) gelten nur für den
    MCP-Server `/mcp`, nicht für die REST-API. Verbundene Anwendungen lassen sich unter
    `/api/oauth/grants` (Browser-Session) einsehen und widerrufen.

    **Instanz-Administration** (`/api/admin`, Tag `admin`): Betreiber-Übersicht und Eingriffe
    (Sperren, Sessions/API-Tokens widerrufen, Owner übertragen, Löschen). Nur
    Browser-Session eines Instanz-Admins; API-Tokens und MCP sind ausgeschlossen. Alle anderen
    Anfragen (auch ohne Anmeldung) erhalten **404**, damit der Bereich nicht auffindbar ist.
    Eingriffe brauchen zusätzlich den Header `X-CSRF-Token` und werden mit `admin=true` auditiert.
    Gesperrte Konten können sich nicht anmelden (Login 403); ihre Sessions und API-Tokens werden
    abgelehnt (401).

    **Erneute Anmeldung für den Admin-Bereich:** Liegt die letzte echte Anmeldung eines Instanz-Admins
    (Passwort- oder Passkey-Login bzw. Bestätigung über `POST /api/auth/reauth` oder
    `POST /api/auth/passkeys/reauth`) länger als `ADMIN_REAUTH_MINUTES` (Default 15) zurück, antworten
    alle `/api/admin`-Endpunkte mit **401** und `{"error":"reauth_required"}`. Nicht-Admins erhalten
    weiterhin 404.
  version: 0.1.0
servers:
  - url: ""
    description: App-Origin (Health unter /healthz, API unter /api)
paths:
  /mcp:
    post:
      summary: MCP-Server für KI-Agenten (Model Context Protocol)
      description: |
        Streamable-HTTP-Endpunkt (zustandslos, JSON-Antworten) des Model Context Protocol. Mit
        persönlichem API-Token (`Authorization: Bearer kgm_…`) oder einem per OAuth erhaltenen
        Access Token (`Authorization: Bearer kgo_…`); ein Session-Cookie reicht nicht.
        Jedes Tool ruft intern die REST-API mit diesem Token auf – es gelten dieselben Rechte.
        OAuth-Access-Tokens sind an diese Ressource gebunden und werden von der REST-API direkt
        nicht akzeptiert.

        Ohne oder mit ungültigem Token antwortet der Endpunkt mit 401 und
        `WWW-Authenticate: Bearer resource_metadata="<PUBLIC_BASE_URL>/.well-known/oauth-protected-resource"`
        (MCP Authorization, RFC 9728). OAuth-fähige Clients (z. B. Claude oder ChatGPT als Connector)
        finden darüber den Authorization Server und brauchen nur die Server-Adresse.

        Tools: `klubs_auflisten`, `klub_ueberblick`, `spieltage_auflisten`, `spieltag_details`,
        `spieler_konto`, `transaktionen_suchen`, `mein_spieler` (nur lesend), `spieltag_erfassen`
        (legt einen Entwurf an, bucht nichts), `spieltag_veroeffentlichen` und `buchung_erfassen`
        (buchen Geld).

        Einrichtung z. B. in Claude Code:
        `claude mcp add --transport http kegelmaster https://<host>/mcp --header "Authorization: Bearer kgm_…"`
      tags: [MCP]
      security: [bearerAuth: [], oauth2: [mcp]]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC-2.0-Nachricht gemäß MCP-Spezifikation
      responses:
        "200":
          description: JSON-RPC-Antwort
        "401":
          description: Kein oder ungültiges Token (mit `WWW-Authenticate`-Challenge inkl. `resource_metadata`)
  /.well-known/oauth-protected-resource:
    get:
      summary: Protected Resource Metadata des MCP-Servers (RFC 9728)
      description: Auch unter `/.well-known/oauth-protected-resource/mcp` erreichbar. Öffentlich, CORS für alle Origins.
      tags: [OAuth]
      security: []
      responses:
        "200":
          description: Metadaten
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: { type: string, example: "https://kegel.example.com/mcp" }
                  authorization_servers: { type: array, items: { type: string }, example: ["https://kegel.example.com"] }
                  bearer_methods_supported: { type: array, items: { type: string }, example: ["header"] }
                  scopes_supported: { type: array, items: { type: string }, example: ["mcp"] }
                  resource_name: { type: string, example: "Kegelmaster" }
  /.well-known/oauth-authorization-server:
    get:
      summary: Authorization Server Metadata (RFC 8414)
      description: |
        Issuer ist `PUBLIC_BASE_URL`. Auch unter `/.well-known/oauth-authorization-server/mcp` erreichbar.
        Andere Pfade unter `/.well-known/` (z. B. `openid-configuration`) liefern 404. Öffentlich, CORS für alle Origins.
      tags: [OAuth]
      security: []
      responses:
        "200":
          description: Metadaten (issuer, authorization_endpoint, token_endpoint, registration_endpoint, revocation_endpoint, unterstützte Verfahren)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /oauth/register:
    post:
      summary: Dynamische Client-Registrierung (RFC 7591)
      description: |
        Registriert einen öffentlichen Client (kein Client-Secret, `token_endpoint_auth_method: none`).
        1–5 `redirect_uris`, jeweils `https://…` oder `http://` auf `localhost`, `127.0.0.1` bzw. `[::1]`,
        ohne Fragment. `client_name` höchstens 100 Zeichen (wird auf der Zustimmungsseite angezeigt).
        Rate-Limit: 20 Registrierungen pro Stunde und Client-IP.
      tags: [OAuth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                redirect_uris: { type: array, items: { type: string }, minItems: 1, maxItems: 5 }
                client_name: { type: string, maxLength: 100 }
                token_endpoint_auth_method: { type: string, enum: [none] }
                grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token] } }
                response_types: { type: array, items: { type: string, enum: [code] } }
      responses:
        "201":
          description: Client registriert
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string, format: uuid }
                  client_id_issued_at: { type: integer }
                  client_name: { type: string }
                  redirect_uris: { type: array, items: { type: string } }
                  grant_types: { type: array, items: { type: string } }
                  response_types: { type: array, items: { type: string } }
                  token_endpoint_auth_method: { type: string, example: none }
                  scope: { type: string, example: mcp }
        "400":
          description: Ungültige Metadaten (`invalid_redirect_uri`, `invalid_client_metadata`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "429":
          description: Rate-Limit überschritten
  /oauth/authorize:
    get:
      summary: Autorisierungs-Endpunkt (Authorization Code + PKCE)
      description: |
        Prüft die Anfrage und leitet den Browser auf die Zustimmungsseite `/oauth/consent` des
        Frontends weiter (nicht angemeldete Benutzer werden dort zuerst zum Login geschickt).
        Unbekannte `client_id` oder nicht registrierte `redirect_uri` ergeben **400** ohne
        Weiterleitung (kein Open Redirect). Andere Fehler werden an die `redirect_uri` gemeldet
        (`error`, `error_description`, `state`, `iss`). Parameter dürfen nicht mehrfach vorkommen.
      tags: [OAuth]
      security: []
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: state, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
      responses:
        "302":
          description: Weiterleitung zur Zustimmungsseite oder Fehler-Weiterleitung an die redirect_uri
        "400":
          description: Unbekannter Client oder nicht registrierte redirect_uri (Klartext-Fehlerseite)
  /oauth/token:
    post:
      summary: Token-Endpunkt
      description: |
        `application/x-www-form-urlencoded`. Öffentliche Clients senden `client_id` im Body.

        * `grant_type=authorization_code`: `code`, `redirect_uri` (exakt wie bei der Autorisierung),
          `client_id`, `code_verifier`, optional `resource`. Codes sind 10 Minuten gültig und nur
          einmal verwendbar; die erneute Verwendung widerruft die damit ausgestellten Tokens.
        * `grant_type=refresh_token`: `refresh_token`, `client_id`, optional `scope`, `resource`.
          Jeder Refresh liefert ein neues Refresh Token; das alte wird ungültig. Wird ein bereits
          verwendetes Refresh Token erneut vorgelegt, wird die gesamte Verbindung widerrufen.

        Access Tokens gelten 1 Stunde, Refresh Tokens 30 Tage ab Ausstellung. Nach Passwortänderung,
        Sitzungs-Widerruf durch einen Instanz-Admin oder Sperrung des Kontos werden Refresh Tokens
        abgelehnt. Rate-Limit: 60 Anfragen pro 5 Minuten und Client-IP.
      tags: [OAuth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                client_id: { type: string, format: uuid }
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string }
                refresh_token: { type: string }
                scope: { type: string }
                resource: { type: string }
      responses:
        "200":
          description: "Tokens (Antwort mit `Cache-Control: no-store`)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string, example: "kgo_…" }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 3600 }
                  refresh_token: { type: string, example: "kgr_…" }
                  scope: { type: string, example: mcp }
        "400":
          description: Ungültige Anfrage, ungültiger/abgelaufener/bereits verwendeter Code oder Refresh Token, PKCE-Fehler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "401":
          description: Unbekannte client_id (`invalid_client`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "429":
          description: Rate-Limit überschritten
  /oauth/revoke:
    post:
      summary: Token widerrufen (RFC 7009)
      description: |
        `application/x-www-form-urlencoded` mit `token` und `client_id`. Widerruft die gesamte Verbindung
        (alle Access- und Refresh Tokens), wenn das Token zu diesem Client gehört. Unbekannte Tokens
        werden ebenfalls mit 200 beantwortet. Rate-Limit: 60 Anfragen pro 5 Minuten und Client-IP.
      tags: [OAuth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, client_id]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
                client_id: { type: string, format: uuid }
      responses:
        "200":
          description: Widerrufen (oder Token unbekannt)
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "401":
          description: Unbekannte client_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
  /api/oauth/authorize:
    get:
      summary: Angaben für die Zustimmungsseite
      description: |
        Prüft die Autorisierungsanfrage (Query-Parameter wie bei `/oauth/authorize`) und liefert, was die
        Zustimmungsseite anzeigt. Nur mit Browser-Session (403 bei Bearer-Auth).
      tags: [OAuth]
      security: [cookieAuth: []]
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
      responses:
        "200":
          description: Anfrage gültig
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string, format: uuid }
                  client_name: { type: string }
                  redirect_uri: { type: string }
                  redirect_host: { type: string }
                  scope: { type: string }
        "400":
          description: Ungültige Anfrage
        "401":
          description: Nicht angemeldet
        "403":
          description: Mit Bearer-Token aufgerufen
    post:
      summary: Zustimmung erteilen oder ablehnen
      description: |
        Speichert die Entscheidung des angemeldeten Benutzers und liefert die Weiterleitung an die
        registrierte `redirect_uri`: bei Zustimmung mit `code`, `state` und `iss`, bei Ablehnung mit
        `error=access_denied`. Nur mit Browser-Session; X-CSRF-Token erforderlich; auditiert.
        Rate-Limit: 30 Anfragen pro 5 Minuten und Client-IP.
      tags: [OAuth]
      security: [cookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/OAuthAuthorizeParams"
                - type: object
                  required: [approve]
                  properties:
                    approve: { type: boolean }
      responses:
        "200":
          description: Weiterleitungsziel
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_to: { type: string }
        "400":
          description: Ungültige Anfrage (unbekannter Client oder nicht registrierte redirect_uri)
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig oder mit Bearer-Token aufgerufen
  /api/oauth/grants:
    get:
      summary: Verbundene Anwendungen auflisten
      description: Per OAuth verbundene Anwendungen des angemeldeten Benutzers. Nur mit Browser-Session (403 bei Bearer-Auth).
      tags: [OAuth]
      security: [cookieAuth: []]
      responses:
        "200":
          description: Liste (neueste zuerst)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OAuthGrant" }
        "401":
          description: Nicht angemeldet
        "403":
          description: Mit Bearer-Token aufgerufen
  /api/oauth/grants/{id}:
    delete:
      summary: Verbundene Anwendung widerrufen
      description: Widerruft die Verbindung samt aller Access- und Refresh Tokens sofort. Nur mit Browser-Session; X-CSRF-Token erforderlich; auditiert.
      tags: [OAuth]
      security: [cookieAuth: []]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Widerrufen
        "400":
          description: Ungültige ID
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig oder mit Bearer-Token aufgerufen
        "404":
          description: Verbindung nicht gefunden (oder gehört einem anderen Benutzer)
  /healthz:
    get:
      summary: Health Check
      tags: [System]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, example: "ok" }
                  version: { type: string, description: "App-Version (Build-Info)" }
  /api/config/public:
    get:
      summary: Öffentliche Konfiguration für das Frontend
      description: Liefert Version, Chat-Verfügbarkeit und optionale URLs (z. B. Buy Me a Coffee). Keine Authentifizierung.
      tags: [System]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, chat_enabled]
                properties:
                  version: { type: string, description: "App-Version (Build-Info)" }
                  chat_enabled: { type: boolean, description: "true wenn GEMINI_API_KEY konfiguriert ist und der Hilfe-Chat verfügbar ist." }
                  buy_me_a_coffee_url: { type: string, format: uri, description: "Nur gesetzt wenn BUY_ME_A_COFFEE_URL konfiguriert ist." }
                  registration_mode:
                    type: string
                    enum: [open, invite_only, closed]
                    description: "Wert von REGISTRATION_MODE (Default open). Das Frontend blendet Registrierungsformular und -links entsprechend aus."
  /api/auth/csrf-token:
    get:
      summary: CSRF-Token abrufen
      tags: [Auth]
      responses:
        "200":
          description: Token (Cookie + JSON-Body)
  /api/auth/me:
    get:
      summary: Angemeldeten User abrufen
      tags: [Auth]
      security: [cookieAuth: [], bearerAuth: []]
      responses:
        "200":
          description: User-Objekt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Nicht angemeldet
    patch:
      summary: Eigene Einstellungen ändern
      description: |
        Ändert die Einstellungen des angemeldeten Users. Nicht angegebene Felder bleiben unverändert.
        X-CSRF-Token erforderlich (bei Browser-Session).
      tags: [Auth]
      security: [cookieAuth: [], bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notify_gameday_settled:
                  type: boolean
                  description: E-Mail-Benachrichtigung, sobald ein Spieltag eines eigenen Clubs abgerechnet wurde.
                tour_seen:
                  type: boolean
                  description: true merkt den Rundgang als gesehen (beendet oder übersprungen). Ein gesetzter Zeitpunkt bleibt erhalten; false ändert nichts.
                setup_hint_seen:
                  type: boolean
                  description: true merkt die Sprechblase zur Ersteinrichtung-Karte als gesehen. Ein gesetzter Zeitpunkt bleibt erhalten; false ändert nichts.
      responses:
        "200":
          description: Aktualisiertes User-Objekt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Ungültige Anfrage
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig
  /api/auth/register:
    post:
      summary: Registrieren und einloggen
      description: |
        Abhängig von `REGISTRATION_MODE` (siehe `registration_mode` in `GET /api/config/public`):
        `open` (Default) – jeder darf sich registrieren, `invite_token` wird ignoriert;
        `invite_only` – nur mit gültigem, nicht abgelaufenem und noch nicht angenommenem Einladungs-Token,
        die E-Mail muss zur Einladung passen (Groß-/Kleinschreibung egal). Die Einladung wird danach wie gewohnt
        über `POST /api/invitations/{token}/accept` angenommen;
        `closed` – immer 403.
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                invite_token:
                  type: string
                  description: Token aus dem Einladungslink (`/invite/{token}`). Pflicht bei `REGISTRATION_MODE=invite_only`.
      responses:
        "201":
          description: User angelegt und eingeloggt
        "400":
          description: Ungültige Anfrage
        "403":
          description: Registrierung nicht erlaubt (`closed`, oder `invite_only` ohne gültige Einladung bzw. mit abweichender E-Mail)
        "409":
          description: E-Mail ist bereits registriert
  /api/auth/login:
    post:
      summary: Login (setzt HTTP-Only Cookie)
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Erfolgreich eingeloggt
        "401":
          description: Anmeldung fehlgeschlagen
        "429":
          description: Zu viele Anmeldeversuche (Rate-Limit pro Client-IP)
  /api/auth/logout:
    post:
      summary: Logout (Cookie löschen)
      tags: [Auth]
      responses:
        "204":
          description: Erfolgreich abgemeldet
  /api/auth/change-password:
    post:
      summary: Eigenes Passwort ändern
      description: |
        Prüft das aktuelle Passwort und setzt ein neues. Alle anderen Sitzungen werden abgemeldet
        und alle API-Tokens widerrufen; das Auth-Cookie des aufrufenden Browsers wird neu ausgestellt
        (inkl. neuem CSRF-Cookie). Nur mit Browser-Session (403 bei Bearer-Auth); X-CSRF-Token erforderlich.
        Rate-Limit pro Client-IP wie beim Login.
      tags: [Auth]
      security: [cookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 128 }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Passwort geändert; aktualisiertes User-Objekt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Aktuelles Passwort falsch oder neues Passwort ungültig
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig oder mit API-Token aufgerufen
        "429":
          description: Zu viele Versuche (Rate-Limit pro Client-IP)
  /api/auth/reauth:
    post:
      summary: Anmeldung mit Passwort bestätigen (Re-Auth)
      description: |
        Bestätigt die aktuelle Browser-Session mit dem Passwort des angemeldeten Benutzers und stellt das
        Auth-Cookie mit frischem `auth_time` neu aus (Remember-Me bleibt erhalten, neues CSRF-Cookie).
        Wird für den Admin-Bereich benötigt, wenn dieser `reauth_required` meldet (`ADMIN_REAUTH_MINUTES`).
        Nur mit Browser-Session (403 bei Bearer-Auth); X-CSRF-Token erforderlich. Rate-Limit pro Client-IP
        wie beim Login. Audit: `user_reauth` bzw. `user_reauth_failed`.
      tags: [Auth]
      security: [cookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Bestätigt; Cookie neu ausgestellt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Ungültige Anfrage oder Passwort fehlt
        "401":
          description: Nicht angemeldet oder Passwort falsch
        "403":
          description: CSRF-Token ungültig oder mit API-Token aufgerufen
        "429":
          description: Zu viele Versuche (Rate-Limit pro Client-IP)
  /api/auth/tokens:
    get:
      summary: Eigene API-Tokens auflisten
      description: Liefert die Tokens des angemeldeten Users ohne Geheimnis. Nur mit Browser-Session (403 bei Bearer-Auth).
      tags: [Auth]
      security: [cookieAuth: []]
      responses:
        "200":
          description: Liste der Tokens (neueste zuerst)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIToken" }
        "401":
          description: Nicht angemeldet
        "403":
          description: Mit API-Token aufgerufen
    post:
      summary: API-Token erstellen
      description: |
        Erstellt ein persönliches API-Token. Das Klartext-Token steht nur in dieser Antwort und
        kann später nicht erneut abgerufen werden. Maximal 20 Tokens pro User.
        Nur mit Browser-Session (403 bei Bearer-Auth); X-CSRF-Token erforderlich.
      tags: [Auth]
      security: [cookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100, example: "Kassen-Agent" }
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  nullable: true
                  description: Gültigkeit in Tagen; weglassen oder null für unbegrenzt.
      responses:
        "201":
          description: Token erstellt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIToken" }
        "400":
          description: Ungültiger Name oder ungültige Gültigkeit
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig oder mit API-Token aufgerufen
        "409":
          description: Maximale Anzahl an Tokens erreicht
  /api/auth/tokens/{id}:
    delete:
      summary: API-Token widerrufen
      description: Löscht ein eigenes Token; es ist sofort ungültig. Nur mit Browser-Session; X-CSRF-Token erforderlich.
      tags: [Auth]
      security: [cookieAuth: []]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Widerrufen
        "400":
          description: Ungültige Token-ID
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig oder mit API-Token aufgerufen
        "404":
          description: Token nicht gefunden (oder gehört einem anderen User)
  /api/auth/passkeys/login/begin:
    post:
      summary: Passkey-Anmeldung starten
      description: |
        Startet eine Anmeldung mit einem beliebigen Passkey dieser Seite (ohne E-Mail-Eingabe).
        Liefert die Optionen für `navigator.credentials.get()` (`PublicKeyCredentialRequestOptionsJSON`
        unter `publicKey`) und setzt das HTTP-only-Cookie `passkey_ceremony` (5 Minuten gültig).
        X-CSRF-Token erforderlich. Rate-Limit pro Client-IP.
      tags: [Auth]
      responses:
        "200":
          description: Optionen für navigator.credentials.get()
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnOptions" }
        "403":
          description: CSRF-Token ungültig
        "429":
          description: Zu viele Versuche
        "503":
          description: Passkeys sind auf diesem Server nicht konfiguriert
  /api/auth/passkeys/login/finish:
    post:
      summary: Passkey-Anmeldung abschließen
      description: |
        Prüft die Antwort des Authenticators gegen die gestartete Zeremonie (Cookie `passkey_ceremony`,
        einmalig verwendbar) und setzt bei Erfolg das Auth-Cookie wie `/api/auth/login`.
        X-CSRF-Token erforderlich. Rate-Limit pro Client-IP.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: object
                  description: Ergebnis von `PublicKeyCredential.toJSON()` (AuthenticationResponseJSON)
                remember_me: { type: boolean, default: false }
      responses:
        "200":
          description: Angemeldet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Ungültige Anfrage oder Zeremonie abgelaufen / bereits verwendet
        "401":
          description: Passkey unbekannt oder Prüfung fehlgeschlagen
        "403":
          description: CSRF-Token ungültig
        "429":
          description: Zu viele Versuche
  /api/auth/passkeys/reauth:
    post:
      summary: Anmeldung mit Passkey bestätigen (Re-Auth)
      description: |
        Schließt eine mit `POST /api/auth/passkeys/login/begin` gestartete Zeremonie (Cookie `passkey_ceremony`,
        einmalig verwendbar) als Bestätigung der aktuellen Browser-Session ab. Der Passkey muss zum
        angemeldeten Benutzer gehören; ein Passkey eines anderen Kontos wird mit 401 abgelehnt und meldet
        nicht um. Bei Erfolg wie `POST /api/auth/reauth`: Cookie mit frischem `auth_time`, neues CSRF-Cookie.
        Nur mit Browser-Session (403 bei Bearer-Auth); X-CSRF-Token erforderlich. Rate-Limit pro Client-IP.
      tags: [Auth]
      security: [cookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: object
                  description: Ergebnis von `PublicKeyCredential.toJSON()` (AuthenticationResponseJSON)
      responses:
        "200":
          description: Bestätigt; Cookie neu ausgestellt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Ungültige Anfrage oder Zeremonie abgelaufen / bereits verwendet
        "401":
          description: Nicht angemeldet, Prüfung fehlgeschlagen oder Passkey gehört nicht zum angemeldeten Konto
        "403":
          description: CSRF-Token ungültig oder mit API-Token aufgerufen
        "429":
          description: Zu viele Versuche
        "503":
          description: Passkeys nicht verfügbar
  /api/auth/passkeys/register/begin:
    post:
      summary: Passkey hinzufügen – starten
      description: |
        Startet das Hinzufügen eines Passkeys für den angemeldeten User. Erfordert das aktuelle Passwort,
        damit eine übernommene Session allein keinen dauerhaften Zugang anlegen kann. Liefert die Optionen
        für `navigator.credentials.create()` (`PublicKeyCredentialCreationOptionsJSON` unter `publicKey`,
        bereits registrierte Passkeys in `excludeCredentials`) und setzt das Cookie `passkey_ceremony`.
        Maximal 20 Passkeys pro User. Nur mit Browser-Session; X-CSRF-Token erforderlich.
      tags: [Auth]
      security: [cookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string, format: password }
      responses:
        "200":
          description: Optionen für navigator.credentials.create()
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnOptions" }
        "400":
          description: Passwort fehlt oder ist falsch
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig oder mit API-Token aufgerufen
        "409":
          description: Maximale Anzahl an Passkeys erreicht
        "429":
          description: Zu viele Versuche
        "503":
          description: Passkeys sind auf diesem Server nicht konfiguriert
  /api/auth/passkeys/register/finish:
    post:
      summary: Passkey hinzufügen – abschließen
      description: |
        Prüft die Antwort von `navigator.credentials.create()` gegen die gestartete Zeremonie und speichert
        den Passkey. Nur mit Browser-Session; X-CSRF-Token erforderlich.
      tags: [Auth]
      security: [cookieAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                name: { type: string, maxLength: 100, example: "iPhone", description: "Leer → \"Passkey\"" }
                credential:
                  type: object
                  description: Ergebnis von `PublicKeyCredential.toJSON()` (RegistrationResponseJSON)
      responses:
        "201":
          description: Passkey gespeichert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400":
          description: Ungültige Anfrage, Zeremonie abgelaufen oder Prüfung fehlgeschlagen
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig oder mit API-Token aufgerufen
        "409":
          description: Passkey ist bereits registriert
  /api/auth/passkeys:
    get:
      summary: Eigene Passkeys auflisten
      description: Liefert die Passkeys des angemeldeten Users ohne Schlüsselmaterial. Nur mit Browser-Session.
      tags: [Auth]
      security: [cookieAuth: []]
      responses:
        "200":
          description: Liste der Passkeys (neueste zuerst)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Passkey" }
        "401":
          description: Nicht angemeldet
        "403":
          description: Mit API-Token aufgerufen
  /api/auth/passkeys/{id}:
    patch:
      summary: Passkey umbenennen
      tags: [Auth]
      security: [cookieAuth: []]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Umbenannt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400":
          description: Ungültiger Name oder ungültige ID
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig oder mit API-Token aufgerufen
        "404":
          description: Passkey nicht gefunden (oder gehört einem anderen User)
    delete:
      summary: Passkey entfernen
      description: Der Passkey kann danach nicht mehr zur Anmeldung verwendet werden. Nur mit Browser-Session; X-CSRF-Token erforderlich.
      tags: [Auth]
      security: [cookieAuth: []]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Entfernt
        "400":
          description: Ungültige ID
        "401":
          description: Nicht angemeldet
        "403":
          description: CSRF-Token ungültig oder mit API-Token aufgerufen
        "404":
          description: Passkey nicht gefunden (oder gehört einem anderen User)
  /api/auth/forgot-password:
    post:
      summary: Passwort vergessen (E-Mail mit Reset-Link)
      tags: [Auth]
      requestBody:
        content:
