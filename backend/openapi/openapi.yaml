            schema:
              type: object
              required: [transaction_type, amount]
              properties:
                transaction_type: { type: string, enum: [deposit, tip, expense] }
                amount: { type: integer, minimum: 1, description: "Betrag in Cent, immer positiv" }
                player_id: { type: string, format: uuid, description: "Pflicht bei deposit und tip" }
                player_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: "Paar-Modus: Einzahlung auf mindestens zwei Spieler verteilen"
                description: { type: string }
                transaction_date: { type: string, format: date, description: "YYYY-MM-DD, Standard: heute" }
                skip_auto_tip:
                  type: boolean
                  default: false
                  description: "Nur bei deposit: Auto-Tip des Klubs für diese eine Einzahlung deaktivieren. Der volle Betrag wird als Einzahlung gebucht (auch über die Schulden hinaus); im Paar-Modus wird der Überschuss auf die Spieler verteilt."
      responses:
