      description: |
        Ersetzt die Strafen des Teilnehmers. Ist der Spieltag bereits veröffentlicht, werden die
        zugehörigen Buchungen angepasst. `count` ist die Menge; Dezimalwerte (höchstens zwei
        Nachkommastellen) nur bei Strafentypen mit `allows_decimal_quantity`, sonst ganze Zahlen.
