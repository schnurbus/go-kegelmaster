                amount: { type: integer, minimum: 1, description: "Betrag in Cent, immer positiv (Ausgaben werden negativ gespeichert)" }
                player_id: { type: string, format: uuid, description: "Pflicht bei deposit und tip" }
                description: { type: string }
                transaction_date: { type: string, format: date, description: "YYYY-MM-DD; leer = Datum bleibt unverändert" }
      responses:
        "200":
          description: Bearbeitete Transaktion
        "400":
          description: Ungültige Eingabe oder Transaktion ist nicht bearbeitbar (Grund-/Strafgebühr)
