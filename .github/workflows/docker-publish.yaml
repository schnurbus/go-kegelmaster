name: Build and push Docker image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # type=sha: short commit SHA (unchanged).
          # main-<UTC timestamp>-<sha>: sortable tag for the test environment
          # (kegelmaster-test.schnurbus.net). Flux' ImagePolicy picks the newest
          # one via the timestamp; SHA tags alone cannot be ordered.
          tags: |
            type=sha,prefix=
            type=raw,value=main-{{date 'YYYYMMDDHHmmss' tz='UTC'}}-{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Shown in the footer (/api/config/public). meta's "version" is the
          # highest-priority tag, i.e. main-<timestamp>-<sha> (raw beats sha),
          # so the test environment shows exactly the deployed image tag.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
