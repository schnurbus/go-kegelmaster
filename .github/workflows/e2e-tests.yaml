name: E2E Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Hier definieren wir die PostgreSQL Datenbank
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kegelmaster
          POSTGRES_PASSWORD: kegelmaster
          POSTGRES_DB: kegelmaster
        ports:
          - 5432:5432
        # Warten, bis Postgres bereit ist
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    # 1. Go Backend & Migrationen
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Run Migrations
      run: |
        go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
        migrate -path backend/migrations -database "postgres://kegelmaster:kegelmaster@localhost:5432/kegelmaster?sslmode=disable" up

    - name: Start Backend
      run: |
        cd backend
        go build -o server ./cmd/api
        ./server &
      env:
        DATABASE_URL: "postgres://kegelmaster:kegelmaster@localhost:5432/kegelmaster?sslmode=disable"
        PORT: "8080"

    - name: Wait for Backend
      run: |
        for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done

    # 2. React Frontend
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend & Playwright
      run: |
        cd frontend
        npm ci
        npx playwright install --with-deps

    # 3. Frontend starten, dann E2E ausführen (in einem Step, damit der Dev-Server läuft)
    - name: Run Playwright tests
      run: |
        cd frontend
        npm run dev &
        npx wait-on http://localhost:5173 -t 60000
        npx playwright test
      env:
        BASE_URL: "http://localhost:5173"
        VITE_BACKEND_URL: "http://localhost:8080"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/